name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Oregana has no plug-in yet, so there is no plugin-macos job, no package and
# no main-build or release workflow: every job builds the JUCE-free engine.
jobs:
  dsp-tests:
    name: DSP unit, audio and perf tiers, Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      # The Python checks and the demo phrases use only the standard library.
      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: >-
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" -DOREGANA_REQUIRE_PYTHON_TESTS=ON

      # The default build includes OreganaDSPCxx17, the Rack toolchain's C++17
      # and -fno-builtin check.
      - name: Build
        run: cmake --build build-dsp --parallel

      - name: Unit tier
        run: ctest --test-dir build-dsp -L '^unit$' --no-tests=error --output-on-failure

      - name: Audio tier
        run: ctest --test-dir build-dsp -L '^audio$' --no-tests=error --output-on-failure

      - name: Perf tier
        run: ctest --test-dir build-dsp -L '^perf$' --no-tests=error --output-on-failure

      - name: Render the demos for review
        run: ./build-dsp/RenderOreganaPresetDemos --jobs 4 Docs/audio/midi build-dsp/demo-audio

      - name: Upload demo audio and CPU figures
        uses: actions/upload-artifact@v4
        with:
          name: ci-audio-oregana-build-${{ github.run_number }}
          path: |
            build-dsp/demo-audio
            build-dsp/cpu.json
          if-no-files-found: error
          retention-days: 7

  dsp-tests-macos:
    name: DSP unit tier, macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure, build and run the unit tier
        run: |
          cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" -DOREGANA_REQUIRE_PYTHON_TESTS=ON
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp -L '^unit$' --no-tests=error --output-on-failure

  dsp-tests-windows:
    name: DSP unit tier, Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: |
          cmake -S "." -B "build-win" -A x64 -DBUILD_TESTING=ON "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" -DOREGANA_REQUIRE_PYTHON_TESTS=ON

      - name: Build and run the unit tier
        run: |
          cmake --build "build-win" --config Release --parallel
          ctest --test-dir "build-win" -C Release -L "^unit$" --no-tests=error --output-on-failure

  sanitizers:
    name: Unit and fuzz tiers under ASan + UBSan, Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clang's sanitizer and libFuzzer runtimes ship in libclang-rt-18-dev.
      - name: Install Ninja and Clang's runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libclang-rt-18-dev

      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fuzz tier is Oregana.DspFuzz, the libFuzzer target over the
      # instrumented DSP. OREGANA_ENABLE_SANITIZERS adds -fsanitize=address,undefined,float-cast-overflow
      # -fno-sanitize-recover=all -fno-omit-frame-pointer to every target.
      - name: Configure the instrumented DSP, tests and libFuzzer target
        run: >-
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DOREGANA_ENABLE_SANITIZERS=ON -DOREGANA_BUILD_FUZZER=ON -DBUILD_TESTING=ON
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" -DOREGANA_REQUIRE_PYTHON_TESTS=ON

      - name: Build
        run: cmake --build build-san --parallel

      - name: Unit and fuzz tiers
        run: ctest --test-dir build-san -L '^(unit|fuzz)$' --no-tests=error --output-on-failure --parallel 2

      # libFuzzer writes a crashing input into the test's working directory.
      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fuzz-reproducers-oregana-build-${{ github.run_number }}
          path: |
            build-san/crash-*
            build-san/oom-*
            build-san/timeout-*
            build-san/leak-*
          if-no-files-found: ignore
          retention-days: 7
