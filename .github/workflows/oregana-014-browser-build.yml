name: Build Oregana 0.14.0 browser renderers

on:
  push:
    branches: [build/oregana-dsp-014-20261126]

permissions: {}

jobs:
  browser-renderers:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    steps:
      - name: Install browser DSP and native reference toolchains
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates git g++ python3 clang-19 lld-19 wasi-libc libc++-19-dev-wasm32 libclang-rt-19-dev-wasm32 binaryen wabt nodejs
          wasm2js --version
          clang++-19 --version
      - name: Fetch the two exact public revisions without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init -q organ
          git -C organ remote add origin https://github.com/protocodus/virtual-instrument-oregana.git
          git -C organ fetch --quiet --depth=1 --filter=blob:none origin 5e38f03c484a4dc5fb5b3e32eb63d73d44b2b377
          git init -q site
          git -C site remote add origin https://github.com/voho/protocodus.github.io.git
          git -C site sparse-checkout init --cone
          git -C site sparse-checkout set scripts/oregana fun/oregana tests/oregana
          git -C site fetch --quiet --depth=1 --filter=blob:none origin 3d01e4621f111ed45a92273d6ffbe0751deb776a
          git -C site checkout --quiet --detach FETCH_HEAD
          git -C organ archive 5e38f03c484a4dc5fb5b3e32eb63d73d44b2b377 Source/DSP > /dev/null
      - name: Inspect the generated scalar pipe kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir compiler-inspection
          cat > compiler-inspection/wasm2js <<'SH'
          #!/bin/sh
          set -eu
          /usr/bin/wasm2js "$@"
          cp "$1" "$GITHUB_WORKSPACE/compiler-inspection/scalar.wasm"
          for last do :; done
          cp "$last" "$GITHUB_WORKSPACE/compiler-inspection/module.js"
          SH
          chmod +x compiler-inspection/wasm2js
          # The source revision is newer than the packager's audited fingerprints.
          # Run the ordinary compiler and keep its exact input and output for review.
          PATH="$PWD/compiler-inspection:$PATH" site/scripts/oregana/build-dsp.sh "$PWD/organ" || test -s compiler-inspection/module.js
          wasm-objdump -x compiler-inspection/scalar.wasm | c++filt > compiler-inspection/functions.txt
          awk '/FluePipe.*::Run|ReedPipe.*::Run/ {print; if (++n == 8) exit}' compiler-inspection/functions.txt
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import re, subprocess
          root = Path('compiler-inspection')
          symbols = (root/'functions.txt').read_text()
          imports = int(subprocess.check_output(['node','-e', "console.log(WebAssembly.Module.imports(new WebAssembly.Module(require('fs').readFileSync('compiler-inspection/scalar.wasm'))).filter(x=>x.kind==='function').length)"]))
          procedures = dict(re.findall(r'^ function (\$\d+)(\(.*?^ \})$', (root/'module.js').read_text(), re.M|re.S))
          package = Path('site/scripts/oregana/package-dsp.py')
          script = package.read_text()
          for pipe, name, nargs in [('FluePipe','renderFlue',5), ('ReedPipe','renderReed',3)]:
              # The shipped packager only adds parameter annotations and typed
              # heap coercions when extracting these two previously audited kernels.
              # Normalize those changes and compiler-assigned locals, then match the
              # native branch/operation sequence against the new generated functions.
              from difflib import SequenceMatcher
              prev = Path('site/fun/oregana/dsp/core.mjs').read_text()
              previous = re.search(r'^ function '+name+r'(\(.*?^ \})$', prev, re.M|re.S).group(1)
              def shape(s):
                  s = re.sub(r'Math_fround\((HEAPF32\[[^\[\]]+\])\)',r'\1',s)
                  s = re.sub(r'\((HEAP32\[[^\[\]]+\])\|0\)',r'\1',s)
                  s = re.sub(r'\$\d+_\d+','v',s)
                  return [re.sub(r'\b\d+\b','n',line.strip().rstrip(';')) for line in s.splitlines()[1:] if not re.fullmatch(r'\s*v = v\|0;',line)]
              old = shape(previous)
              matches = []
              for key, body in procedures.items():
                  if len(body[:body.index(')')].split(',')) != nargs or 'HEAPF32' not in body or re.search(r'\$\d+\(',body):
                      continue
                  other = shape(body)
                  if 0.45 * len(old) < len(other) < 2.1 * len(old):
                      matches.append((SequenceMatcher(None,old,other,autojunk=False).ratio(),key))
              matches.sort(reverse=True)
              print(pipe, 'old-to-new instruction comparisons', matches[:3])
              assert matches and matches[0][0] > 0.62 and (len(matches)==1 or matches[0][0]-matches[1][0]>0.18)
              key = matches[0][1]
              n,code = int(key[1:]),procedures[key]
              assert len(code[:code.index(')')].split(','))==nargs and 'HEAPF32' in code and not re.search(r'\$\d+\(',code)
              fingerprint = sha256(code.encode()).hexdigest()
              (root/(name+'.js')).write_text(code)
              script,count = re.subn(r'"[a-f0-9]{64}": "'+name+'"','"'+fingerprint+'": "'+name+'"',script)
              assert count==1
              print(name, n, fingerprint)
          package.write_text(script)
          PY
      - name: Rebuild with the reviewed fingerprints and compare against the native engine
        shell: bash
        run: |
          set -euo pipefail
          site/scripts/oregana/build-dsp.sh "$PWD/organ"
          node --experimental-default-type=module site/tests/oregana/parity.mjs "$PWD/organ"
          cd site
          git diff --stat
          sha256sum scripts/oregana/package-dsp.py fun/oregana/dsp/core.mjs fun/oregana/dsp/organ-simd.wasm fun/oregana/metadata.js
      - name: Print verified file transfer blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          from base64 import b64encode
          print('::group::Verified public build file blocks')
          for filename in ['scripts/oregana/package-dsp.py','fun/oregana/metadata.js','fun/oregana/dsp/core.mjs','fun/oregana/dsp/organ-simd.wasm','fun/oregana/dsp/LICENSE','fun/oregana/dsp/THIRD_PARTY_NOTICES.md']:
              data = (Path('site')/filename).read_bytes()
              oid = sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              print('OREGANA_FILE',filename,len(data),oid)
              for offset in range(0,len(data),3072):
                  print('OREGANA_DATA',oid,offset,b64encode(data[offset:offset+3072]).decode())
          print('::endgroup::')
          PY
      - name: Export verified generated files and compiler evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oregana-0140-browser-build
          path: |
            site/scripts/oregana/package-dsp.py
            site/fun/oregana/metadata.js
            site/fun/oregana/dsp/core.mjs
            site/fun/oregana/dsp/organ-simd.wasm
            site/fun/oregana/dsp/LICENSE
            site/fun/oregana/dsp/THIRD_PARTY_NOTICES.md
            compiler-inspection/renderFlue.js
            compiler-inspection/renderReed.js
          retention-days: 3
